
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Ajustar data inicial para 30/08/2026
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from datetime import date

          inicio = date(2026, 8, 30)
          hoje = date.today()

          for arquivo in Path("profile-3d-contrib").glob("*.svg"):
              texto = arquivo.read_text(encoding="utf-8")

              # Ajusta o texto do intervalo exibido no SVG.
              texto = re.sub(
                  r'\d{4}-\d{2}-\d{2}(?=\s*/)',
                  inicio.isoformat(),
                  texto
              )

              arquivo.write_text(texto, encoding="utf-8")

          print(f"Data inicial configurada: {inicio}")
          print(f"Data final: {hoje}")
          PY

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Atualiza GitHub City"; then
            git push
          fi
