name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clonar a ferramenta
        run: |
          git clone https://github.com/yoshi389111/github-profile-3d-contrib.git /tmp/3d
          cd /tmp/3d
          npm ci

      - name: Patch do período inicial
        run: |
          cd /tmp/3d
          grep -rn "setFullYear\|getFullYear\|- 1\|from" src/*.ts | head -30
