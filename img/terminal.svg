<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" rx="18" fill="#030806"/>

  <!-- Terminal header -->
  <rect width="1600" height="52" rx="18" fill="#121b16"/>
  <rect y="34" width="1600" height="18" fill="#121b16"/>

  <!-- macOS buttons -->
  <circle cx="28" cy="26" r="8" fill="#e6ad45"/>
  <circle cx="52" cy="26" r="8" fill="#e6ad45"/>
  <circle cx="76" cy="26" r="8" fill="#e6ad45"/>

  <text x="800" y="33"
        text-anchor="middle"
        font-family="monospace"
        font-size="16"
        fill="#718078">terminal — bash</text>

  <!-- Terminal text -->
  <g font-family="monospace" font-size="27" fill="#00ff88">
    <text x="38" y="105">$ cd github.com/taronukem</text>

    <text x="38" y="160">$ whoami</text>

    <text x="38" y="207">Daniel Rolando</text>
    <text x="38" y="245">Software Engineering Student @ PUC Minas</text>

    <text x="38" y="300">$ cat about.txt</text>

    <text x="38" y="347">🎓 Engenharia de Software</text>
    <text x="38" y="385">🏫 PUC Minas</text>
    <text x="38" y="423">📍 Belo Horizonte, Brazil</text>

    <text x="38" y="478">$ ls languages</text>

    <text x="38" y="525">Java</text>
    <text x="38" y="563">Python</text>

    <text x="38" y="618">$ echo "Welcome to my GitHub!"</text>

    <text x="38" y="665">Welcome to my GitHub. 👋</text>

    <text x="38" y="720">$</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="73" y="694" width="16" height="30" fill="#00ff88">
    <animate attributeName="opacity"
             values="1;1;0;0;1"
             keyTimes="0;0.45;0.5;0.95;1"
             dur="1s"
             repeatCount="indefinite"/>
  </rect>
</svg>